[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-safecall"
version = "0.2.3"
description = "Validate LLM responses with Pydantic, retry failed model calls and inspect call reports in Python."
keywords = ["llm", "pydantic", "structured-output", "schema-validation", "retries", "ai-agents"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "tenacity>=9.0",
  "typing-extensions>=4.10"
]

[project.optional-dependencies]
# Require patched transports even when a provider SDK is already installed.
openai = ["openai>=1.50.0", "anyio>=4.14.2", "certifi>=2026.10.19", "idna>=3.15"]
anthropic = ["anthropic>=0.34", "anyio>=4.14.2", "certifi>=2026.10.19", "idna>=3.15"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "build>=1.2", "twine>=5.1", "pre-commit>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
fixable = ["ALL"]
unfixable = []
preview = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]


[project.urls]
Homepage = "https://github.com/GuardianMesh/llm-safecall"
Source = "https://github.com/GuardianMesh/llm-safecall"
Tracker = "https://github.com/GuardianMesh/llm-safecall/issues"

[project.scripts]
llm-safecall = "llm_safecall.cli:main"
