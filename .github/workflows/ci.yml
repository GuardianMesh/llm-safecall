name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtimes:
    name: Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=llm_safecall --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_package.py dist/*.whl
  test:
    if: always()
    needs: runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all supported runtimes
        env:
          RUNTIME_RESULT: ${{ needs.runtimes.result }}
        run: test "$RUNTIME_RESULT" = success
